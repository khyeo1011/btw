[project]
name = "btw"
version = "0.1.0"
description = "A joke programming language with a real compiler, a Big O checker and a language server"
readme = "README.md"
authors = [{ name = "Sebastian Yeo", email = "khyeo81@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["pygls>=2.1.1"]

[project.scripts]
btw = "btw.cli:main"
btw-lsp = "btw.lsp:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
